<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataVisual SV — Demo Restaurante · Selector de Paquete</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&family=Syne:wght@600;700;800&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#F0F4F8;color:#1A2535;font-size:13px;min-height:100vh}

/* ════════════════════════════════════
   SELECTOR BAR (siempre visible arriba)
════════════════════════════════════ */
.pkg-bar{
  background:#07101E;
  display:flex;align-items:stretch;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;top:0;z-index:200;
}
.pkg-bar-label{
  display:flex;align-items:center;padding:0 20px;
  font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
  color:rgba(255,255,255,.25);letter-spacing:2.5px;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.06);
}
.pkg-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 6px;cursor:pointer;border:none;background:transparent;
  border-right:1px solid rgba(255,255,255,.06);
  transition:background .2s;position:relative;
  gap:2px;
}
.pkg-btn:last-child{border-right:none}
.pkg-btn:hover{background:rgba(255,255,255,.05)}
.pkg-btn-name{font-size:11px;font-weight:800;letter-spacing:.5px;transition:color .2s}
.pkg-btn-desc{font-size:9px;font-weight:400;opacity:.45;letter-spacing:.3px}
.pkg-btn-price{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;transition:color .2s}
.pkg-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;transition:background .2s}

/* Starter active */
.pkg-btn.sel-s .pkg-btn-name{color:#F4A623}
.pkg-btn.sel-s .pkg-btn-price{color:#F4A623}
.pkg-btn.sel-s{background:rgba(244,166,35,.07)}
.pkg-btn.sel-s::after{background:#F4A623}
/* Growth active */
.pkg-btn.sel-g .pkg-btn-name{color:#2ECC71}
.pkg-btn.sel-g .pkg-btn-price{color:#2ECC71}
.pkg-btn.sel-g{background:rgba(46,204,113,.07)}
.pkg-btn.sel-g::after{background:#2ECC71}
/* Pro active */
.pkg-btn.sel-p .pkg-btn-name{color:#C39BD3}
.pkg-btn.sel-p .pkg-btn-price{color:#C39BD3}
.pkg-btn.sel-p{background:rgba(155,89,182,.07)}
.pkg-btn.sel-p::after{background:#9B59B6}

.pkg-btn-name,.pkg-btn-price,.pkg-btn-desc{color:rgba(255,255,255,.35)}
.pkg-btn.sel-s .pkg-btn-desc,.pkg-btn.sel-g .pkg-btn-desc,.pkg-btn.sel-p .pkg-btn-desc{opacity:.55}

/* ════════════════════════════════════
   ROOT — fades on switch
════════════════════════════════════ */
#root{transition:opacity .2s ease}
#root.fading{opacity:0;pointer-events:none}

/* ════════════════════════════════════
   SHARED LAYOUT
════════════════════════════════════ */
.topbar{display:flex;align-items:center;padding:0 24px;height:54px;border-bottom:4px solid var(--acc)}
.brand{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:2px}
.top-title{flex:1;text-align:center;font-size:15px;font-weight:800;color:#fff}
.pkg-badge{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:5px 14px;border-radius:3px;white-space:nowrap}

.subbar{padding:10px 24px 13px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
.subbar-info h2{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.subbar-info p{font-size:11px;color:rgba(255,255,255,.4)}
.subbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src-chip{font-size:9px;font-weight:700;padding:3px 10px;border-radius:3px;font-family:'DM Mono',monospace}
.per-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:600;padding:5px 14px;border-radius:3px}

.filters{background:#fff;border-bottom:1px solid #E2E8F0;padding:9px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.f-lbl{font-size:10px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.filters select{border:1px solid #E2E8F0;border-radius:5px;padding:5px 10px;font-size:11px;color:#1A2535;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;transition:.15s}
.filters select:focus{border-color:var(--acc)}
.f-sep{width:1px;height:18px;background:#E2E8F0;flex-shrink:0}
.f-space{flex:1}
.f-wm{color:#CBD5E1;font-size:9px;font-weight:700;letter-spacing:2px;font-family:'DM Mono',monospace}

/* alert bar */
.alert-bar{margin:14px 24px 0;border-radius:6px;padding:9px 14px;font-size:11px;font-weight:600;border-left:4px solid;line-height:1.5}
.alert-bar.ok{background:#E8FBF3;border-color:#1DAF72;color:#0D5E37}
.alert-bar.warn{background:#FFF7E6;border-color:#E8860A;color:#7A4B00}
.alert-bar.crit{background:#FEE8E8;border-color:#E74C3C;color:#7F1D1D}

/* cards */
.card{background:#fff;border-radius:8px;border:1px solid #E2E8F0;padding:16px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;color:#0F172A;display:flex;align-items:center;gap:6px}
.card-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.exp-btn{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:4px;padding:3px 8px;font-size:9px;font-weight:700;cursor:pointer;color:#64748B;font-family:'DM Sans',sans-serif;transition:.15s}
.exp-btn:hover{background:#fff;color:#0F172A;border-color:var(--acc)}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #E2E8F0;padding:0 24px;overflow-x:auto}
.tab{padding:10px 18px;font-size:12px;font-weight:700;color:#64748B;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.active{border-bottom-color:var(--acc);color:var(--acc)}
.tab:hover:not(.active){background:#F8FAFC}
.tabcontent{display:none}.tabcontent.active{display:block}
.tab-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:#F1F5F9;color:#64748B;font-family:'DM Mono',monospace}
.tab.active .tab-pill{background:var(--acc-light);color:var(--acc)}

/* layouts */
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:0 24px 12px}
.g21{display:grid;grid-template-columns:3fr 2fr;gap:12px;padding:0 24px 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 24px 12px}
.g31{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:0 24px 12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:0 24px 12px}
.gfull{padding:0 24px 12px}

/* kpi grids */
.kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 24px}
.kpi-grid-10{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 24px}
.kpi-grid-free{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;padding:14px 24px}

/* kpi card base */
.kpi{background:#fff;border-radius:8px;border:1px solid #E2E8F0;padding:13px 15px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:default}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px}
.kpi-lbl{font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.kpi-val{font-size:21px;font-weight:800;color:#0F172A;line-height:1;margin-bottom:3px}
.kpi-delta{font-size:10px;font-weight:700}
.up{color:#1DAF72}.dn{color:#E74C3C}.neutral{color:#64748B}
.kpi-sub{font-size:9px;color:#94A3B8;margin-top:2px}
/* rag dot on kpi */
.kpi-rag{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%}
.kpi-rag.g{background:#1DAF72;box-shadow:0 0 7px rgba(29,175,114,.6)}
.kpi-rag.a{background:#F39C12;box-shadow:0 0 7px rgba(243,156,18,.6)}
.kpi-rag.r{background:#E74C3C;box-shadow:0 0 7px rgba(231,76,60,.6)}
/* threshold label (growth) */
.kpi-thresh{position:absolute;bottom:10px;right:10px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:'DM Mono',monospace}
.kpi-thresh.g{background:#E8FBF3;color:#1DAF72}
.kpi-thresh.r{background:#FDE8E8;color:#E74C3C}
.kpi-thresh.a{background:#FFF3D6;color:#E8860A}

/* table */
.tbl-srch{display:flex;gap:8px;margin-bottom:10px}
.tbl-srch input{border:1px solid #E2E8F0;border-radius:5px;padding:6px 10px;font-size:11px;font-family:'DM Sans',sans-serif;outline:none;flex:1}
.tbl-srch input:focus{border-color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl thead th{background:#F8FAFC;color:#64748B;font-weight:700;padding:7px 10px;text-align:left;border-bottom:2px solid #E2E8F0;font-size:9px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tbl thead th:hover{color:#0F172A}
.tbl td{padding:7px 10px;border-bottom:1px solid #F8FAFC;color:#374151}
.tbl tr:hover td{background:#F8FAFC}
.badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px}
.badge-g{background:#D1FAE5;color:#065F46}
.badge-r{background:#FEE2E2;color:#991B1B}
.badge-a{background:#FEF3C7;color:#92400E}
.pg-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #E2E8F0}
.pg-btn{border:1px solid #E2E8F0;background:#fff;border-radius:4px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;color:#64748B}
.pg-btn:hover{background:#F8FAFC}

/* food cost bar */
.fc-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F8FAFC}
.fc-item:last-child{border:none}
.fc-name{width:130px;font-weight:600;color:#334155;font-size:10px}
.fc-bar{flex:1;background:#F1F5F9;border-radius:4px;height:8px;overflow:hidden}
.fc-fill{height:100%;border-radius:4px}
.fc-pct{width:38px;text-align:right;font-weight:700;font-size:10px;font-family:'DM Mono',monospace}

/* RAG strip (pro) */
.rag-strip{display:flex;margin:14px 24px 0;border-radius:6px;overflow:hidden;border:1px solid #E2E8F0}
.rag-cell{flex:1;padding:7px 12px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:6px;border-right:1px solid #E2E8F0}
.rag-cell:last-child{border-right:none}
.rag-cell.r{background:#FFF1F2;color:#E74C3C}
.rag-cell.a{background:#FFFBEB;color:#F39C12}
.rag-cell.g{background:#F0FFF8;color:#1DAF72}
.rag-dot{width:8px;height:8px;border-radius:50%}
.rag-dot.r{background:#E74C3C}.rag-dot.a{background:#F39C12}.rag-dot.g{background:#1DAF72}

/* exec hero (pro) */
.exec-hero{border-radius:8px;padding:20px 24px;display:flex;align-items:center;gap:28px;margin:14px 24px 0}
.exec-hero h2{font-family:'Raleway',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.exec-hero .big{font-family:'Raleway',sans-serif;font-size:36px;font-weight:900;color:#fff;line-height:1}
.exec-hero .sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:5px}
.exec-stats{display:flex;gap:22px;flex-shrink:0}
.estat .ev{font-family:'Raleway',sans-serif;font-size:22px;font-weight:900;color:var(--acc)}
.estat .el{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* rag summary cards (pro) */
.rag-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 24px 0}
.rag-item{background:#fff;border-radius:6px;border:1px solid #E2E8F0;padding:10px 14px;flex:1;min-width:140px}
.rag-item .ri-l{font-size:9px;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:700}
.rag-item .ri-v{font-size:17px;font-weight:900;color:#0F172A;font-family:'DM Mono',monospace;line-height:1.1}
.rag-item .ri-s{font-size:10px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}

/* heatmap */
.hm-wrap{display:grid;grid-template-columns:auto repeat(7,1fr);gap:2px;font-size:9px}
.hm-hdr{display:flex;align-items:center;justify-content:center;font-weight:700;color:#64748B;padding-bottom:3px;font-size:9px}
.hm-lbl{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#94A3B8;font-weight:600;font-size:9px}
.hm-cell{border-radius:3px;height:26px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:rgba(0,0,0,.45);cursor:default;transition:.2s;font-family:'DM Mono',monospace}
.hm-cell:hover{transform:scale(1.1);z-index:10;position:relative}

/* proj note */
.proj-note{font-size:9px;color:#94A3B8;font-style:italic;margin-top:6px;padding:0 24px}

/* footer */
.disclaimer{background:#fff;border-top:1px solid #E2E8F0;padding:6px 24px;font-size:9px;color:#94A3B8;text-align:center;margin-top:6px}
.footer{text-align:center;padding:8px;color:rgba(255,255,255,.25);font-size:9px;letter-spacing:.5px;font-family:'DM Mono',monospace}

/* pkg float badge */
.pkg-float{position:fixed;bottom:20px;right:20px;font-size:10px;font-weight:800;padding:6px 16px;border-radius:4px;font-family:'DM Mono',monospace;z-index:300;letter-spacing:.5px;cursor:default;transition:all .3s}

/* ════════════════════════════════════
   VISUAL DIFFERENTIATION MARKERS
   Starter: minimal, clean, no tabs
   Growth: structured, badge-heavy
   Pro: dark hero, full luxury
════════════════════════════════════ */
/* Starter: subtle border-left on kpi */
.starter-kpi-stripe{border-left:4px solid var(--acc)}
/* Growth: bottom color bar on kpi */
.growth-kpi .kpi-accent{bottom:0;top:auto}
/* Pro: full left glow on kpi + dark accent */
.pro-kpi{background:#FAFBFF;border:1px solid #DDE4F0}

/* Locked overlay for starter (shows what Growth/Pro add) */
.locked-hint{
  background:#F8FAFC;border:2px dashed #D1D5DB;border-radius:8px;
  padding:20px;text-align:center;color:#94A3B8;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.locked-hint .lk-icon{font-size:24px}
.locked-hint .lk-title{font-size:12px;font-weight:700;color:#64748B}
.locked-hint .lk-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
</style>
</head>

let allRows=[],filtRows=[],sortC=0,sortD=1,pg=0;const PG=9;
function genRows(){
  const cats=['Pupusas','Carnes','Mariscos','Ensaladas','Sopas'];
  const prods=['Pupusas Revueltas','Res a la Plancha','Camarones Jalapeños','Ensalada César','Sopa de Res','Pollo Asado','Pupusas de Queso'];
  const catMap={'Pupusas Revueltas':'Pupusas','Pupusas de Queso':'Pupusas','Res a la Plancha':'Carnes','Pollo Asado':'Carnes','Camarones Jalapeños':'Mariscos','Ensalada César':'Ensaladas','Sopa de Res':'Sopas'};
  const est=['g','g','g','a','r'];
  const rows=[];
  const base=new Date(2025,4,31);
  for(let i=0;i<55;i++){
    const d=new Date(base);d.setDate(base.getDate()-i);
    const p=prods[i%prods.length];
    const u=Math.floor(5+Math.random()*30);
    const pr=parseFloat((8+Math.random()*14).toFixed(2));
    const tot=parseFloat((u*pr).toFixed(2));
    const mar=Math.floor(50+Math.random()*35);
    const e=est[Math.floor(Math.random()*est.length)];
    rows.push({f:d.toLocaleDateString('es-SV'),prod:p,cat:catMap[p],u,tot,mar,e});
  }
  return rows;
}
function renderTbl(){
  const b=document.getElementById('tblBody');if(!b)return;
  const s=pg*PG,slice=filtRows.slice(s,s+PG);
  b.innerHTML=slice.map(r=>`<tr>
    <td style="font-family:'DM Mono',monospace;font-size:10px">${r.f}</td>
    <td style="font-weight:600">${r.prod}</td>
    <td>${r.cat}</td>
    <td style="text-align:center">${r.u}</td>
    <td style="font-weight:700;color:${THEMES[curPkg].acc}">$${r.tot.toFixed(2)}</td>
    <td>${r.mar}%</td>
    <td><span class="badge badge-${r.e}">${r.e==='g'?'✓ Vendido':r.e==='a'?'Pendiente':'⚠ Anulado'}</span></td>
  </tr>`).join('');
  const pi=document.getElementById('pgInfo');
  if(pi)pi.textContent=`Pág. ${pg+1}/${Math.ceil(filtRows.length/PG)} · ${filtRows.length} registros`;
}
function filterTbl(){
  const q=(document.getElementById('tblSearch')||{}).value||'';
  filtRows=q.toLowerCase()?allRows.filter(r=>r.prod.toLowerCase().includes(q.toLowerCase())||r.cat.toLowerCase().includes(q.toLowerCase())):allRows.slice();
  pg=0;renderTbl();
}
function sortTbl(c){
  if(sortC===c)sortD*=-1;else{sortC=c;sortD=1;}
  const k=['f','prod','cat','u','tot','mar','e'];
  filtRows.sort((a,b)=>a[k[c]]<b[k[c]]?-sortD:a[k[c]]>b[k[c]]?sortD:0);
  pg=0;renderTbl();
}
function prevPg(){if(pg>0){pg--;renderTbl();}}
function nextPg(){if((pg+1)*PG<filtRows.length){pg++;renderTbl();}}

/* ──────────────────────────────────────
   MAIN RENDER
────────────────────────────────────── */
function render(){
  const T=THEMES[curPkg];
  applyTheme(T);
  const root=document.getElementById('root');

  if(curPkg==='s') root.innerHTML=buildStarter(T);
  else if(curPkg==='g') root.innerHTML=buildGrowth(T);
  else root.innerHTML=buildPro(T);

  // float badge
  let fb=document.getElementById('pkgFloat');
  if(!fb){fb=document.createElement('div');fb.id='pkgFloat';fb.className='pkg-float';document.body.appendChild(fb);}
  fb.style.background=T.floatBg;fb.style.color=T.floatText;
  fb.style.boxShadow=`0 4px 20px ${T.acc}55`;
  fb.textContent=T.name;

  // run charts after DOM settles
  requestAnimationFrame(()=>buildCharts());

  // table
  allRows=genRows();filtRows=allRows.slice();renderTbl();
}

function ragItem(label,val,cls,sub,T){
  const clr={g:'#1DAF72',a:'#F39C12',r:'#E74C3C'};
  return `<div class="rag-item">
    <div class="ri-l">${label}</div>
    <div class="ri-v">${val}</div>
    <div class="ri-s" style="color:${clr[cls]}">
      <span style="width:8px;height:8px;border-radius:50%;background:${clr[cls]};display:inline-block"></span>${sub}
    </div>
  </div>`;
}

/* ──────────────────────────────────────
   CHARTS
────────────────────────────────────── */
function buildCharts(){
  const T=THEMES[curPkg];
  const d=D[curPer];
  const vd=getSem(d.vd,curSem);
  const vlbls=vd.map((_,i)=>{const b=curSem==='all'?0:parseInt(curSem)*7;return String(b+i+1);});

  const ACC=T.acc;
  const grid='#F0F4F8';
  const BAR_COLORS=vd.map(v=>v>=1000?'rgba(29,175,114,.85)':v>=700?`${ACC}BB`:'rgba(231,76,60,.65)');

  // Ventas diarias (shared id = cVentas)
  mk('cVentas',{type:'bar',data:{labels:vlbls,datasets:[{label:'Ventas ($)',data:vd,
    backgroundColor:BAR_COLORS,borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'$'+c.raw.toLocaleString()}}},
      scales:{y:{ticks:{callback:v=>'$'+v},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // Donut productos
  mk('cPlatos',{type:'doughnut',data:{labels:d.pl.l,datasets:[{data:d.pl.d,backgroundColor:COLS6,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,cutout:'58%',plugins:{legend:{position:'bottom',labels:{font:{size:9},padding:4}},tooltip:{callbacks:{label:c=>'$'+c.raw.toLocaleString()}}}}});

  // Meta vs Real (starter only)
  mk('cMeta',{type:'bar',data:{labels:['Real','Meta'],datasets:[{data:[d.vm,d.meta],
    backgroundColor:['rgba(29,175,114,.85)','rgba(231,76,60,.2)'],borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},y:{grid:{display:false},ticks:{font:{size:11,weight:'700'}}}}}});

  // Tendencia (growth)
  mk('cTrend',{type:'line',data:{labels:TRENDS.meses,datasets:[
    {label:'2025',data:TRENDS['2025'],borderColor:ACC,backgroundColor:ACC+'22',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:ACC,pointBorderColor:'#fff',pointBorderWidth:2},
    {label:'2024',data:TRENDS['2024'],borderColor:'#94A3B8',borderDash:[5,5],borderWidth:1.5,pointRadius:3,backgroundColor:'transparent'}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // Comparativo 3 meses
  mk('cComp',{type:'bar',data:{labels:PER.slice().reverse(),datasets:[
    {label:'2025',data:[D[2].vm,D[1].vm,D[0].vm],backgroundColor:[ACC+'55',ACC+'88',ACC+'EE'],borderRadius:4},
    {label:'Meta',data:[D[2].meta,D[1].meta,D[0].meta],type:'bar',backgroundColor:'rgba(231,76,60,.12)',borderWidth:1.5,borderColor:'#E74C3C',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}});

  // Por día de semana
  mk('cDias',{type:'bar',data:{labels:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],
    datasets:[{data:[820,790,850,780,1100,1380,1200],
      backgroundColor:['rgba(26,143,165,.7)','rgba(26,143,165,.7)','rgba(26,143,165,.7)','rgba(26,143,165,.7)',ACC+'BB',ACC+'EE',ACC+'CC'],borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v},grid:{color:grid}}}}});

  // Costos pie
  mk('cCostos',{type:'pie',data:{labels:['Ingredientes','Nómina','Renta','Servicios','Otros'],
    datasets:[{data:[31,28,18,12,11],backgroundColor:['#E74C3C','#0F2C4A',ACC,'#1A8FA5','#94A3B8'],borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9},padding:4}}}}});

  // PRO: Proyección
  mk('cProj',{type:'line',data:{labels:['Ene','Feb','Mar','Abr','May','Jun*','Jul*','Ago*'],datasets:[
    {label:'Real 2025',data:[22000,23500,24800,26100,28450,null,null,null],borderColor:ACC,backgroundColor:ACC+'22',fill:true,tension:.4,pointRadius:4},
    {label:'Proyección',data:[null,null,null,null,28450,29800,31200,32500],borderColor:'#1DAF72',borderDash:[6,3],backgroundColor:'rgba(29,175,114,.08)',fill:true,tension:.4,pointRadius:4,borderWidth:2},
    {label:'2024',data:[19800,21200,22500,23400,24200,null,null,null],borderColor:'#94A3B8',borderDash:[4,4],borderWidth:1.5,pointRadius:3}]},
    options:{responsive:true,spanGaps:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // PRO: Year comp
  mk('cYearComp',{type:'bar',data:{labels:PER.slice().reverse(),datasets:[
    {label:'2025',data:[D[2].vm,D[1].vm,D[0].vm],backgroundColor:ACC+'CC',borderRadius:4},
    {label:'2024',data:[ANT[2],ANT[1],ANT[0]],backgroundColor:'rgba(148,163,184,.5)',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}});

  // PRO: Inventario
  mk('cInv',{type:'bar',data:{labels:d.inv.map(i=>i.p),datasets:[
    {label:'Stock Actual',data:d.inv.map(i=>i.s),backgroundColor:d.inv.map(i=>i.t==='r'?'rgba(231,76,60,.8)':i.t==='a'?'rgba(243,156,18,.8)':'rgba(29,175,114,.8)'),borderRadius:4},
    {label:'Stock Mínimo',data:d.inv.map(i=>i.min),backgroundColor:'rgba(10,18,40,.18)',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>v+' u.'},grid:{color:grid}}}}});

  // PRO: Equipo comparativo
  mk('cEquipoComp',{type:'bar',data:{labels:d.ms.map(m=>m.n.split(' ')[0]),datasets:[
    {label:'2025',data:d.ms.map(m=>m.v),backgroundColor:ACC+'CC',borderRadius:4},
    {label:'2024',data:d.ms.map(m=>Math.floor(m.v*0.88)),backgroundColor:'rgba(148,163,184,.5)',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:9}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9}}},y:{ticks:{callback:v=>'$'+v.toLocaleString()},grid:{color:grid}}}}});

  // PRO: Horas
  mk('cHoras',{type:'bar',data:{labels:d.hr.l,datasets:[{label:'Ventas ($)',data:d.hr.d,backgroundColor:ACC+'AA',borderRadius:3}]},
    options:{responsive:true,plugins:{legend:{display:false}},
      scales:{y:{ticks:{callback:v=>'$'+v},grid:{color:grid}},x:{grid:{display:false},ticks:{font:{size:9}}}}}});

  // Heatmap
  const hm=document.getElementById('heatmap');
  if(hm){
    const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const hrs=['12am','6am','12pm','6pm'];
    const vals=[[50,80,120,200],[60,90,140,250],[55,85,130,220],[50,80,125,210],[80,120,220,380],[100,150,280,420],[90,140,260,400]];
    const mx=420;
    let html='<div class="hm-wrap"><div></div>'+days.map(d=>`<div class="hm-hdr">${d}</div>`).join('');
    hrs.forEach((h,hi)=>{
      html+=`<div class="hm-lbl">${h}</div>`;
      days.forEach((_,di)=>{
        const v=vals[di][hi];const pct=v/mx;
        const a=0.12+pct*0.88;
        const bg=v>300?`rgba(231,76,60,${a})`:v>180?`rgba(243,156,18,${a})`:v>80?`${ACC}${Math.floor(a*255).toString(16).padStart(2,'0')}`:`rgba(29,175,114,${a*.6})`;
        html+=`<div class="hm-cell" style="background:${bg}" title="${days[di]} ${h}: $${v}">$${v}</div>`;
      });
    });
    html+='</div>';hm.innerHTML=html;
  }

  // Food cost bars
  buildFoodCostBars(d,'fcList');
}

/* ──────────────────────────────────────
   INIT
────────────────────────────────────── */
applyTheme(THEMES['s']);
render();
</script>
</body>
